# Pipeline del device-agent: unit → SIL → HIL.
#
# - unit / SIL corren en runners de GitHub en cada PR y push a develop: agente + GPIO simulado
#   + backend local.
# - HIL corre SÓLO con disparo manual (Actions → Run workflow): un runner ubuntu-latest se une
#   a la tailnet de Tailscale y entra por SSH a la Raspberry Pi para levantar el agente (proceso
#   Python, sin contenedor) y correr el mismo test de lazo con GPIO real contra EKS. La Raspi ya
#   NO es un self-hosted runner de GitHub (se retiró el soporte de ARM32 — ver
#   docs/hil-sil.md y la nota en memoria project_hil_arm32_ssh_pivot). Nunca se dispara
#   automáticamente: requiere el hardware cableado y el backend desplegado en EKS.
#
# Ver docs/hil-sil.md en el repo de infraestructura del Lab 4.
name: Device Agent – SIL & HIL

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'device-agent/**'
      - 'hil/**'
      - 'src/**'
      - '.github/workflows/hil.yml'
  push:
    branches: [develop]
    paths:
      - 'device-agent/**'
      - 'hil/**'
      - 'src/**'
      - '.github/workflows/hil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests del agente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r device-agent/requirements-dev.txt

      - name: Pytest
        working-directory: device-agent
        run: python -m pytest -v

  sil:
    name: SIL (GPIO simulado + backend local)
    needs: unit
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://localhost:8080
      GPIO_BACKEND: file
      FAKE_GPIO_DIR: ${{ github.workspace }}/.fake-gpio
      HIL_MODE: sil
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r device-agent/requirements-dev.txt

      - name: Levantar backend local
        run: |
          docker build -f docker-config/Dockerfile -t backend:sil .
          docker run -d --name backend -p 8080:8080 backend:sil
          for i in $(seq 1 30); do
            curl -sf "$BACKEND_URL/api/devices/health" && exit 0
            sleep 2
          done
          docker logs backend; exit 1

      - name: Levantar agente con GPIO simulado
        working-directory: device-agent
        run: |
          nohup python -m agent > "$RUNNER_TEMP/agent.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agent.pid"

      - name: Test de lazo (SIL)
        env:
          AGENT_STOP_CMD: kill $(cat ${{ runner.temp }}/agent.pid)
        run: python -m pytest hil -v --junitxml=sil-results.xml

      - name: Logs
        if: always()
        run: |
          cp "$RUNNER_TEMP/agent.log" agent.log || true
          docker logs backend > backend.log 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sil-${{ github.sha }}
          path: |
            sil-results.xml
            agent.log
            backend.log

  hil:
    name: HIL (Raspberry Pi vía Tailscale SSH + EKS)
    needs: sil
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Agregar revisores obligatorios al environment "hil" para exigir aprobación manual
    environment: hil
    # Hay una sola Raspi: las corridas se encolan, nunca se pisan
    concurrency:
      group: hil-raspi
      cancel-in-progress: false
    env:
      BACKEND_URL: ${{ vars.EKS_ENDPOINT }}
      RASPI: ${{ vars.RASPI_SSH_USER }}@${{ vars.RASPI_SSH_HOST }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verificar variables necesarias
        run: |
          test -n "$BACKEND_URL" || { echo "Variable EKS_ENDPOINT no definida"; exit 1; }
          test -n "${{ vars.RASPI_SSH_USER }}" || { echo "Variable RASPI_SSH_USER no definida"; exit 1; }
          test -n "${{ vars.RASPI_SSH_HOST }}" || { echo "Variable RASPI_SSH_HOST no definida"; exit 1; }

      - name: Conectar a la tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar clave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.RASPI_SSH_KEY }}" > ~/.ssh/raspi_key
          chmod 600 ~/.ssh/raspi_key
          ssh-keyscan -H "${{ vars.RASPI_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar device-agent y hil a la Raspi
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/raspi_key" \
            device-agent hil "$RASPI:~/hil-ci/"

      - name: Verificar prerequisitos remotos
        run: |
          ssh -i ~/.ssh/raspi_key "$RASPI" '
            uname -m
            python3 -c "import gpiod, pytest, requests"
            test -e /dev/gpiochip0
          '

      - name: Arrancar agente en la Raspi
        run: |
          ssh -i ~/.ssh/raspi_key "$RASPI" bash -s <<EOF
            cd ~/hil-ci/device-agent
            pkill -f "python3 -m agent" || true
            BACKEND_URL="$BACKEND_URL" GPIO_CHIP=/dev/gpiochip0 \
              nohup python3 -m agent > /tmp/hil-agent.log 2>&1 &
            echo \$! > /tmp/hil-agent.pid
          EOF

      - name: Test de lazo (HIL)
        run: |
          ssh -i ~/.ssh/raspi_key "$RASPI" bash -s <<EOF
            cd ~/hil-ci/hil
            export BACKEND_URL="$BACKEND_URL"
            export HIL_MODE=hil
            export GPIO_CHIP=/dev/gpiochip0
            export AGENT_STOP_CMD="kill \\\$(cat /tmp/hil-agent.pid)"
            python3 -m pytest -v --junitxml=/tmp/hil-results.xml
          EOF

      - name: Traer resultados y logs
        if: always()
        run: |
          scp -i ~/.ssh/raspi_key "$RASPI:/tmp/hil-results.xml" hil-results.xml || true
          scp -i ~/.ssh/raspi_key "$RASPI:/tmp/hil-agent.log" agent.log || true

      - name: Limpieza remota
        if: always()
        run: |
          ssh -i ~/.ssh/raspi_key "$RASPI" 'kill "$(cat /tmp/hil-agent.pid)" 2>/dev/null || true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hil-${{ github.sha }}
          path: |
            hil-results.xml
            agent.log
